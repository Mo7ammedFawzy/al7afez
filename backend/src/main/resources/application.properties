spring.application.name=al7afez

server.port=6767

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# SQL Server datasource
spring.datasource.url=${AL7AFEZ_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=al7afez;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${AL7AFEZ_DB_USERNAME:sa}
spring.datasource.password=${AL7AFEZ_DB_PASSWORD:123456789}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.database-platform=com.al7afez.al7afez.config.NationalizedSqlServerDialect

# Disable Spring Security auto-config
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

